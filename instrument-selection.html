<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleção de Instrumento - Minha Jornada</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .instrument-selection-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .instrument-selection-modal {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .instrument-selection-modal h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 28px;
            font-weight: 600;
        }

        .instrument-selection-modal .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .instrument-selection-modal .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .instruments-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border-radius: 8px;
            background: #f9f9f9;
        }

        .instruments-grid::-webkit-scrollbar {
            width: 6px;
        }

        .instruments-grid::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .instruments-grid::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        .instrument-option {
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .instrument-option:hover {
            border-color: #667eea;
            background: #f5f7ff;
            transform: translateX(4px);
        }

        .instrument-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
            font-weight: 600;
        }

        .instrument-option .instrument-info {
            flex: 1;
        }

        .instrument-option .instrument-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 4px;
        }

        .instrument-option .instrument-tonalidade {
            font-size: 12px;
            color: #999;
        }

        .instrument-option .checkmark {
            display: none;
            font-size: 18px;
            color: #667eea;
            font-weight: bold;
        }

        .instrument-option.selected .checkmark {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-continue {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 40px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            flex: 1;
        }

        .btn-continue:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-continue:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading-spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            display: none;
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            color: #666;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #667eea;
        }

        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .piano-icon {
            font-size: 24px;
            margin-right: 12px;
        }
    </style>
</head>
<body>
    <div class="instrument-selection-container" id="instrumentSelectionContainer">
        <div class="instrument-selection-modal">
            <h1>🎵 Escolha seu Instrumento</h1>
            <p class="subtitle">Selecione seu instrumento para configurar seu Estudo Musical</p>
            
            <div class="error-message" id="errorMessage"></div>

            <div class="filter-group">
                <label>Filtrar por tonalidade:</label>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-tonalidade="all">Todos</button>
                    <button class="filter-btn" data-tonalidade="Sib">Sib</button>
                    <button class="filter-btn" data-tonalidade="Dó">Dó</button>
                    <button class="filter-btn" data-tonalidade="Ré">Ré</button>
                    <button class="filter-btn" data-tonalidade="Mib - 2ª Clave">Mib - 2ª Clave</button>
                    <button class="filter-btn" data-tonalidade="Fá">Fá</button>
                    <button class="filter-btn" data-tonalidade="Sol">Sol</button>
                    <button class="filter-btn" data-tonalidade="Lá">Lá</button>
                </div>
            </div>

            <div class="instruments-grid" id="instrumentsList">
                <!-- Preenchido por JavaScript -->
            </div>

            <div class="button-group">
                <button class="btn-continue" id="continueBtn" disabled>
                    <span class="loading-spinner"></span>
                    Continuar
                </button>
            </div>
        </div>
    </div>

    <script>
        const InstrumentSelection = {
            selectedInstrument: null,
            allInstruments: [],
            currentFilter: 'all',

            async init() {
                console.log('🎵 Inicializando seleção de instrumento');
                
                try {
                    // Verificar se usuário já tem instrumento
                    const hasInst = await fetch('/api/instruments/has-instrument')
                        .then(r => r.json());
                    
                    if (hasInst.has_instrument) {
                        console.log('✅ Usuário já tem instrumento, redirecionando para dashboard');
                        this.closeAndRedirect();
                        return;
                    }

                    // Carregar lista de instrumentos
                    await this.loadInstruments();
                    this.setupEventListeners();
                } catch (e) {
                    console.error('Erro ao inicializar:', e);
                    this.showError('Erro ao carregar instrumentos. Tente recarregar a página.');
                }
            },

            async loadInstruments() {
                try {
                    const response = await fetch('/api/instruments');
                    if (!response.ok) throw new Error('Erro ao carregar instrumentos');
                    
                    this.allInstruments = await response.json();
                    console.log(`✅ ${this.allInstruments.length} instrumentos carregados`);
                    
                    this.renderInstruments();
                } catch (e) {
                    console.error('Erro ao carregar instrumentos:', e);
                    this.showError('Erro ao carregar lista de instrumentos');
                }
            },

            renderInstruments() {
                const container = document.getElementById('instrumentsList');
                container.innerHTML = '';

                const filtered = this.currentFilter === 'all' 
                    ? this.allInstruments 
                    : this.allInstruments.filter(i => i.tonalidade === this.currentFilter);

                filtered.forEach(inst => {
                    const div = document.createElement('div');
                    div.className = 'instrument-option';
                    if (this.selectedInstrument === inst.id) {
                        div.classList.add('selected');
                    }
                    
                    div.innerHTML = `
                        <div class="instrument-info">
                            <div class="instrument-name">${inst.name}</div>
                            <div class="instrument-tonalidade">Tonalidade: ${inst.tonalidade}</div>
                        </div>
                        <div class="checkmark">✓</div>
                    `;
                    
                    div.addEventListener('click', () => this.selectInstrument(inst.id));
                    container.appendChild(div);
                });
            },

            selectInstrument(id) {
                this.selectedInstrument = id;
                this.renderInstruments();
                document.getElementById('continueBtn').disabled = false;
            },

            setupEventListeners() {
                // Botão continuar
                document.getElementById('continueBtn').addEventListener('click', () => this.saveInstrument());

                // Filtros
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentFilter = e.target.dataset.tonalidade;
                        this.renderInstruments();
                    });
                });

                // Permitir Enter para salvar
                window.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && this.selectedInstrument && !document.getElementById('continueBtn').disabled) {
                        this.saveInstrument();
                    }
                });
            },

            async saveInstrument() {
                if (!this.selectedInstrument) {
                    this.showError('Selecione um instrumento');
                    return;
                }

                const btn = document.getElementById('continueBtn');
                const spinner = btn.querySelector('.loading-spinner');
                
                btn.disabled = true;
                spinner.style.display = 'inline-block';

                try {
                    const response = await fetch('/api/instruments/select', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ instrumento: this.selectedInstrument })
                    });

                    if (!response.ok) {
                        const data = await response.json();
                        throw new Error(data.error || 'Erro ao salvar instrumento');
                    }

                    const data = await response.json();
                    console.log('✅ Instrumento salvo com sucesso:', data);
                    
                    // Redirecionar para dashboard
                    setTimeout(() => this.closeAndRedirect(), 500);
                } catch (e) {
                    console.error('Erro ao salvar:', e);
                    this.showError(e.message || 'Erro ao salvar instrumento');
                    btn.disabled = false;
                    spinner.style.display = 'none';
                }
            },

            showError(message) {
                const errorEl = document.getElementById('errorMessage');
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            },

            closeAndRedirect() {
                const container = document.getElementById('instrumentSelectionContainer');
                if (container) {
                    container.style.display = 'none';
                }
                // Redirecionar ou carregar dashboard
                if (typeof window.onInstrumentSelected === 'function') {
                    window.onInstrumentSelected();
                } else {
                    window.location.href = '/dashboard';
                }
            }
        };

        // Iniciar quando o DOM está pronto
        document.addEventListener('DOMContentLoaded', () => InstrumentSelection.init());
    </script>
</body>
</html>
